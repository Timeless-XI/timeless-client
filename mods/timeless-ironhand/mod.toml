name = "Timeless Ironhand"
version = "1.0.2"
authors = ["TimelessXI"]
description = "The Steaming Sheep's card game. Monsters drop their own cards, notorious monsters rare ones and Champions foils; keep them in the cardbook (/cardbook, or the Timeless menu), build a deck of fifteen, and play the regulars at the game table after dark. The big cards show each monster's real model from your game files, turning slowly (TimelessXI client). Needs the server's ironhand module."
permissions = ["packets.write"]

[settings.popup]
type = "bool"
default = true
label = "New Card Popup"
help = "Shows a card you've just found, with its monster turning slowly."

[settings.sounds]
type = "bool"
default = true
label = "Card Sounds"
help = "Shuffling, cards turning over, winning and losing, and a chime for a new card."

[commands.cardbook]
help = "Opens or closes your cardbook."
args = ""

[commands.ironhand]
help = "Opens the table while a game is on; otherwise the cardbook."
args = ""
