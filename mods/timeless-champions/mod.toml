name = "Timeless Champions"
version = "1.0.0"
authors = ["TimelessXI"]
description = "Champions you can see coming (/champs): a glowing aura in their rank's colour, their affixes as badges over their heads (hover for what each does), hazards such as an Alpha's rally range, thorns and shields drawn round them, and lines to the monsters an Alpha rallied."
permissions = ["packets.write"]

[commands.champs]
help = "Turns the Champion auras, badges and hazards on or off."
args = ""
forms = [
  { args = "aura", help = "The ground rings and lights." },
  { args = "lights", help = "Only the lights (they show with Night Lighting Modern)." },
  { args = "badges", help = "The affix badges over their heads." },
  { args = "badges target", help = "Badges for your target only." },
  { args = "badges all", help = "Badges for every Champion near you." },
  { args = "hazards", help = "Rally range, thorns, shields, haze, drain, healing, shadows." },
  { args = "rally", help = "Lines from an Alpha to the monsters it rallied." },
  { args = "labels", help = "Words such as \"Rally range\" on the ground." },
  { args = "opacity <0.2-1>", help = "How solid the rings and lines are." },
  { args = "test", help = "A sample Legendary Champion on your target for 20 seconds." },
]

[commands.timelesschampions]
help = "The same as /champs."
args = ""
