name = "Timeless Town Life"
version = "1.1.2"
authors = ["TimelessXI"]
description = "Bastok, lived in: speech bubbles over the townsfolk, lamp posts the lamplighter lights at dusk, sounds by place (hammering, crowds, gulls) and a Town window (/town) with the headlines, the caravan, market day and the gossip. Needs the server's townlife module."
permissions = ["packets.write"]

[settings.bubbles]
type = "bool"
default = true
label = "Speech Bubbles"
help = "What townsfolk say shows in a bubble over their head."

[settings.lamps]
type = "bool"
default = true
label = "Lamp Glow"
help = "With Night Lighting set to Modern (TimelessXI client build 7): the lamp posts on the lamplighter's round stay dark at night until he lights them, and his lantern and the guards' torches give light after dark."

[settings.sounds]
type = "bool"
default = true
label = "Town Sounds"
help = "Hammering by the furnaces, crowds on the plaza and in the tavern, gulls on the docks."

[commands.town]
help = "Opens or closes the Town window."
args = ""
forms = [
  { args = "update", help = "Asks for the latest news." },
]

[commands.townlife]
help = "The same as /town."
args = ""
