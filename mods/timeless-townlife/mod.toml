name = "Timeless Town Life"
version = "1.3.0"
authors = ["TimelessXI"]
description = "Bastok, lived in, by day and by night: speech bubbles over the townsfolk, lamp posts the lamplighter lights at dusk, the night watch's lanterns, sounds by place (hammering, crowds, gulls, the tavern's lute and card game after dark, the docks at dawn), apprentices at work by the furnaces and a Town window (/town) with the headlines, the caravan, market day and the gossip. Needs the server's townlife module."
permissions = ["packets.write"]

[settings.bubbles]
type = "bool"
default = true
label = "Speech Bubbles"
help = "What townsfolk say shows in a bubble over their head."

[settings.lamps]
type = "bool"
default = true
label = "Lamp Glow"
help = "With Night Lighting set to Modern (TimelessXI client build 7): the lamp posts on the lamplighter's round stay dark at night until he lights them, and his lantern, the guards' torches, the night watch's lanterns and the candle on the Steaming Sheep's card table give light after dark."

[settings.workshop]
type = "bool"
default = true
label = "Apprentices at Work"
help = "Over an apprentice working at the Bastok Markets furnaces: a progress bar, sparks or steam, and the furnace's glow (with Modern night lighting)."

[settings.sounds]
type = "bool"
default = true
label = "Town Sounds"
help = "Hammering by the furnaces, crowds on the plaza and in the tavern, gulls on the docks, the Steaming Sheep's lute and card game after dark, and crates on the docks at dawn, and apprentices hammering, weaving or brewing at the furnaces."

[commands.town]
help = "Opens or closes the Town window."
args = ""
forms = [
  { args = "update", help = "Asks for the latest news." },
]

[commands.townlife]
help = "The same as /town."
args = ""
